[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Bryan Agan",email = "bryanagan25@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.128.0,<0.129.0)",
    "sqlalchemy[asyncio] (>=2.0.45,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "load-dotenv (>=0.1.0,<0.2.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.12.0,<26.0.0)",
    "ruff (>=0.14.11,<0.15.0)",
    "types-aiobotocore-s3 (>=3.1.3,<4.0.0)"
]
