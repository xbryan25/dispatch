version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    depends_on:
      - backend

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
